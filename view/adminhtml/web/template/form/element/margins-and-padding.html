<!--
    Margins and padding: one Magento field row per group (label + control), laid out like any other field.
    Each group switches between All / V·H / Sides inputs.
    Drag the side icon to change a value, arrows step 1 (Shift: 10).
    CSS shorthand ("10px 15px") fills the sides: pasted at once, typed when typing stops, on Enter or blur.
-->
<!-- ko foreach: spacingGroups -->
<div class="admin__field admin__field-medium"
     data-bind="visible: $parent.visible, css: $parent.additionalClasses, attr: {'data-index': $parent.index}">
    <div class="admin__field-label">
        <label><span data-bind="text: label"></span><span class="mls-spacing-unit">, px</span></label>
    </div>
    <div class="admin__field-control mls-spacing" data-bind="css: {'_with-tooltip': $parent.tooltip}">
        <div class="mls-spacing-modes" role="group" data-bind="attr: {'aria-label': modesLabel}, foreach: modes">
            <button type="button" tabindex="-1" data-bind="
                text: label,
                css: {active: $parent.mode() === id},
                attr: {'aria-pressed': $parent.mode() === id ? 'true' : 'false'},
                click: $parent.setMode,
                disable: $parent.disabled"></button>
        </div>
        <div class="mls-spacing-inputs" data-bind="attr: {'data-mode': mode}, foreach: inputs">
            <div class="mls-spacing-cell" data-bind="css: {_invalid: invalid}">
                <span class="mls-spacing-grip" aria-hidden="true" data-bind="html: icon, attr: {title: scrubTitle}, event: {pointerdown: scrub}"></span>
                <input type="text" class="admin__control-text mls-spacing-input" data-bind="
                    textInput: value,
                    event: {input: input, keydown: keydown, paste: paste, blur: blur},
                    attr: {'aria-label': ariaLabel, placeholder: placeholder},
                    disable: $parent.disabled">
            </div>
        </div>

        <!-- ko with: $parent -->
            <!-- ko if: $parentContext.$index() === 0 -->
                <input type="text" hidden ko-value="value" attr="id: uid, name: inputName">
                <render args="tooltipTpl" if="$data.tooltip"></render>
            <!-- /ko -->
            <!-- ko if: $parentContext.$index() === spacingGroups.length - 1 -->
                <label class="admin__field-error" if="error" attr="for: uid" text="error"></label>
            <!-- /ko -->
        <!-- /ko -->
    </div>
</div>
<!-- /ko -->
