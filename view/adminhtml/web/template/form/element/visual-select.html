<div class="admin__field admin__field-visual-select mls-visual-select"
     data-bind="css: {
        'mls-visual-select-many': options().reduce(function (width, option) {
            return width + String(option.title).length + 4;
        }, 0) > 36
     }">
    <input type="text"
           ko-value="value"
           ko-disabled="disabled"
           attr="name: inputName"/>

    <ol data-bind="foreach: options, css: {'_disabled': disabled}">
        <li data-bind="click: function() { if(!$parent.disabled()) {$parent.value(value);} }, css: {active: $parent.value() == value, 'admin__field-visual-select-small': $data.size == 'small', 'admin__field-visual-select-large': $data.size == 'large', 'no-pointer-events': $parent.disabled()}, event: {keyup: function() { if(!$parent.disabled() && (event.keyCode==32||event.keyCode==13)) { $parent.value(value);} }}, attr: { tabindex: !$parent.disabled() ? 0 : 'false', name: value }">
            <img if="$data.icon" data-bind="attr:{src: $data.icon}" draggable="false" aria-hidden="true"/>
            <!-- ko if: $data.size == 'large' -->
                <div ifnot="$data.icon" class="admin__field-visual-select-spacer"></div>
                <br>
            <!-- /ko -->
            <span translate="$data.title"></span>
        </li>
    </ol>

    <select class="admin__control-select mls-visual-select-dropdown"
            data-bind="
                options: options,
                optionsText: 'title',
                optionsValue: 'value',
                value: value,
                disable: disabled,
                attr: {id: uid}"></select>

    <div if="noticeMessage" class="message message-notice notice">
        <!-- ko with: {noticeMessageUnsanitizedHtml: noticeMessage} -->
            <div data-ui-id="messages-message-notice" html="noticeMessageUnsanitizedHtml"></div>
        <!-- /ko -->
    </div>
</div>
